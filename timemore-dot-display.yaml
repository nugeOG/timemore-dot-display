# ============================================================================
# Timemore Dot companion display — top-level ESPHome device config
# ============================================================================
#
# Built for the Home Assistant ESPHome add-on. This is the only file you
# need to place in the add-on's config folder yourself (alongside
# secrets.yaml) — the LVGL screen config and the timemore_dot component are
# pulled straight from this project's public GitHub repo at build time via
# `packages:`/`external_components:` below, so you don't need to copy
# scale-display-lvgl.yaml or the components/ folder by hand. See README.md
# for the full walkthrough.
#
# Needs secrets.yaml alongside it — copy secrets.yaml.example and fill in
# real values (the ESPHome add-on keeps one shared secrets.yaml for all your
# device configs, so you likely already have one; just add these keys to it).
#
# See HANDOFF.md for full status. As of this writing: the display and
# touchscreen are confirmed working on real hardware (correct orientation,
# all four buttons register correctly, touch calibrated to real measured
# values) -- see the "Screen orientation" section there for that trail.
# The timemore_dot BLE component is still being debugged: it compiles and
# links, but crashes on boot inside NimBLE's own init sequence, and a
# wifi/BT coexistence fix has been applied but not yet proven to fix it.
# ============================================================================

substitutions:
  name: timemore-dot-display
  friendly_name: "Timemore Dot Display"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
  # Default wifi modem-sleep power saving duty-cycles the radio in a way
  # that reliably breaks BLE connection establishment on the ESP32's
  # single shared 2.4GHz radio -- every real-hardware BLE connect attempt
  # to the Dot scale timed out (status=13/BLE_HS_ETIMEOUT) at exactly this
  # config until this was set. See HANDOFF.md's BLE investigation log.
  power_save_mode: none

captive_portal:

logger:

# ----------------------------------------------------------------------
# Network fan-out (confirmed design decision, see HANDOFF.md "Multi-device
# / relay considerations"): BLE peripherals like this scale only accept one
# central connection at a time, so this ESP32 is the sole BLE client and
# everything else that wants weight/battery/connection state gets it over
# wifi instead of trying to share the BLE link itself.
#
# `api:` is the primary path — it's what Home Assistant auto-discovers and
# integrates through, and it's already all the sensor/binary_sensor/button
# entities defined below need to become visible in HA (and to be able to
# trigger a remote tare from HA/automations). MQTT is included commented-out
# below as the alternative for any non-HA consumer that wants the data.
# ----------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # NOTE: ESPHome's `dev` branch supports a bare `encryption:` block here
    # that inherits the api: key above instead of a separate password
    # (avoids one secret and some flash/RAM) -- but that hasn't shipped in
    # a numbered release yet as of 2026.8.2, so back to a plain password
    # for now. Worth switching once it's actually released.
    password: !secret ota_password

# Uncomment for non-Home-Assistant consumers. Requires an MQTT broker
# reachable from this device's wifi network (e.g. Mosquitto).
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_username
#   password: !secret mqtt_password

time:
  - platform: sntp
    id: sntp_time

# ----------------------------------------------------------------------
# Display + touch — pins and driver confirmed on real hardware.
#
# The board's silkscreen reads "TPM408-2.8", a specific "Cheap Yellow
# Display" variant -- a community TFT_eSPI config for that exact board
# uses these same SPI/CS/DC/backlight pins, and confirmed on real hardware
# renders correctly with model: ILI9342 (see HANDOFF.md's "Screen
# orientation" section for the full trail, including a first attempt
# that didn't work). Touch pins (XPT2046 IRQ/CS/its own SPI bus) were
# never independently verified against a schematic, but work correctly
# in practice -- see the confirmed calibration values below.
# ----------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    id: main_lcd
    # Manually combining model: ILI9341 with dimensions: {320,240} +
    # transform: swap_xy: true (previous attempt) produced a corrupted,
    # increasingly-garbled render (a real photo showed the status row
    # near the origin rendering fine, then progressively worse toward
    # the middle/bottom, still with an untouched region at the end) --
    # consistent with an addressing/stride mismatch from combining those
    # primitives in a way that isn't how they're meant to be used
    # together for this chip. ESPHome ships a purpose-built model for
    # exactly this "ILI9341 chipset, landscape-native panel" case instead
    # of composing the transform by hand: ILI9XXXILI9342 (same command
    # set as ILI9341 -- INITCMD_ILI9341 -- constructed with width=320,
    # height=240 directly, no swap_xy/dimensions override needed). The
    # board's silkscreen reads "TPM408-2.8"; a community TFT_eSPI config
    # for that exact board (same SPI/CS/DC/backlight pins as below,
    # confirming the board-family match) declares TFT_WIDTH 320/
    # TFT_HEIGHT 240 and TFT_RGB_ORDER TFT_RGB, which is what led here.
    model: ILI9342
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    color_order: RGB
    # If the image now fills the whole screen without corruption but
    # reads upside-down or mirrored, that's a much simpler follow-up:
    # add a transform: {mirror_x: true} and/or {mirror_y: true} block
    # here (still untested which, if any, this panel needs).
    # Became a required option (no default) in a newer ESPHome release than
    # this was originally written against. `false` is the common default
    # for this panel, but it's a real per-panel property, not a placeholder
    # -- if colors look inverted/negative once you can see the screen
    # (e.g. the dark background renders light), flip this to `true`.
    invert_colors: false

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21

light:
  - platform: monochromatic
    id: backlight
    output: backlight_output
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

touchscreen:
  platform: xpt2046
  id: main_touch
  spi_id: touch_spi
  cs_pin: GPIO33
  # GPIO36 is one of the ESP32's input-only pins (34-39) -- no internal
  # pull resistor hardware exists on those at all, so requesting one (the
  # implicit default for an interrupt pin) logs a harmless but noisy
  # `gpio_pullup_en` error every boot. Disabled explicitly here; relies on
  # the touch panel having its own external pull-up on T_IRQ, which is
  # standard on this class of board -- if touch input doesn't register at
  # all once wired up, this assumption is the first thing to revisit.
  interrupt_pin:
    number: GPIO36
    mode:
      input: true
  update_interval: 50ms
  # Measured via the on_touch logging hook (see HANDOFF.md) -- tapped all
  # four corners, read settled x_raw/y_raw off the "cal" log tag. Both
  # corners sharing an edge agreed within ~30 raw units of each other, so
  # this should be reasonably accurate; resistive touchscreens do still
  # have some inherent nonlinearity per ESPHome's own docs.
  calibration:
    x_min: 187
    x_max: 3797
    y_min: 302
    y_max: 3792
  # Raw touch coordinates come from the panel's fixed physical wiring,
  # independent of the display's own orientation (model: ILI9342 above) --
  # swap_xy: true got the axes aligned correctly (confirmed: touch moves
  # the right way left/right and up/down, not swapped/diagonal). Two real
  # touch tests then found both remaining mirrors needed: vertical
  # (touching near the top registered near the bottom -- mirror_y) and
  # horizontal (pressing "start" registered as "reset", "mode" registered
  # as "tare" -- exactly a left/right swap of the four-button row --
  # mirror_x). Confirmed working: all four corners land correctly, and
  # `calibration:` above now uses real measured values instead of the
  # full raw-range placeholder.
  transform:
    swap_xy: true
    mirror_x: true
    mirror_y: true

# ----------------------------------------------------------------------
# BLE scale component + entities
# ----------------------------------------------------------------------
# Re-enabled. Was disabled for a crash bisection test that confirmed the
# boot crash IS tied to this component -- see HANDOFF.md for the full
# trail (a wifi/BT coexistence fix was applied but never actually proven,
# since the git refresh caching muddied that test too; the display/touch
# work happened in the meantime while this stayed disabled). Picking the
# NimBLE crash investigation back up now.
external_components:
  - source: github://nugeOG/timemore-dot-display@main
    components: [timemore_dot]
    refresh: always

timemore_dot:
  id: dot_scale

globals:
  - id: current_flow_rate
    type: float
    restore_value: false
    initial_value: '0'

sensor:
  - platform: timemore_dot
    timemore_dot_id: dot_scale
    weight:
      name: "${friendly_name} Weight"
      id: weight_grams
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_weight
              text: !lambda 'return str_sprintf("%.1f", x);'
          # Simple flow-rate estimate from consecutive weight samples --
          # replace with a smoothed rolling-window calc if this is noisy.
          - lambda: |-
              static float last_weight = 0;
              static uint32_t last_time = 0;
              uint32_t now = millis();
              float rate = 0;
              if (last_time != 0 && now > last_time) {
                rate = (x - last_weight) / ((now - last_time) / 1000.0f);
              }
              last_weight = x;
              last_time = now;
              id(current_flow_rate) = rate;
          - lvgl.label.update:
              id: lbl_flow
              text: !lambda 'return str_sprintf("%.1f g/s", id(current_flow_rate));'
    battery_level:
      name: "${friendly_name} Battery"
      id: scale_battery
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_battery_pct
              text: !lambda 'return str_sprintf("%.0f%%", x);'

  - platform: wifi_signal
    name: "${friendly_name} Wifi Signal"
    id: wifi_signal_pct
    update_interval: 60s

binary_sensor:
  - platform: timemore_dot
    timemore_dot_id: dot_scale
    connected:
      name: "${friendly_name} Scale Connected"
      id: ble_connected
      on_state:
        then:
          - lvgl.label.update:
              id: lbl_bt_icon
              text: !lambda 'return std::string(x ? "\U0000E1A8" : "\U0000E1A9");'
              text_color: !lambda 'return x ? lv_color_hex(0x5DCAA5) : lv_color_hex(0x7A7A76);'

button:
  - platform: timemore_dot
    timemore_dot_id: dot_scale
    name: "${friendly_name} Tare"
    id: tare_button

packages:
  lvgl_screen:
    url: https://github.com/nugeOG/timemore-dot-display
    files: [scale-display-lvgl.yaml]
    ref: main
    refresh: always
