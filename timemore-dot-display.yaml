# ============================================================================
# Timemore Dot companion display — top-level ESPHome device config
# ============================================================================
#
# Built for the Home Assistant ESPHome add-on. Drop this whole repo
# (this file, scale-display-lvgl.yaml, components/, fonts/) into the
# add-on's config folder and it should show up as a device to install.
# Needs secrets.yaml alongside it — copy secrets.yaml.example and fill in
# real values (the ESPHome add-on keeps one shared secrets.yaml for all your
# device configs, so you likely already have one; just add these keys to it).
#
# NOT YET BUILT OR TESTED ON REAL HARDWARE. See HANDOFF.md for full status —
# in short: the BLE protocol is confirmed from source, the display/touch
# section below is a best-guess placeholder for a specific commonly-sold
# board (not confirmed to match what you actually bought), and the
# timemore_dot component compiles against an API surface that hasn't been
# verified by an actual build yet.
# ============================================================================

substitutions:
  name: timemore-dot-display
  friendly_name: "Timemore Dot Display"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

logger:

# ----------------------------------------------------------------------
# Network fan-out (confirmed design decision, see HANDOFF.md "Multi-device
# / relay considerations"): BLE peripherals like this scale only accept one
# central connection at a time, so this ESP32 is the sole BLE client and
# everything else that wants weight/battery/connection state gets it over
# wifi instead of trying to share the BLE link itself.
#
# `api:` is the primary path — it's what Home Assistant auto-discovers and
# integrates through, and it's already all the sensor/binary_sensor/button
# entities defined below need to become visible in HA (and to be able to
# trigger a remote tare from HA/automations). MQTT is included commented-out
# below as the alternative for any non-HA consumer that wants the data.
# ----------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Uncomment for non-Home-Assistant consumers. Requires an MQTT broker
# reachable from this device's wifi network (e.g. Mosquitto).
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_username
#   password: !secret mqtt_password

time:
  - platform: sntp
    id: sntp_time

# ----------------------------------------------------------------------
# Display + touch — PLACEHOLDER pin assignments.
#
# HANDOFF.md open item #1: the exact driver chip / touch controller /
# pinout for the specific board purchased was never confirmed. The pins
# below match the commonly-sold "Cheap Yellow Display" (ESP32-2432S028R,
# ILI9341 + resistive XPT2046) because the listing description recorded in
# HANDOFF.md ("2.8 inch ESP32 LVGL WIFI Bluetooth Touch 240x320") is close
# to verbatim marketing copy for that specific board — but this is a guess
# based on how it's usually sold, NOT a confirmed match to your unit.
# CONFIRM against your board's actual silkscreen/schematic before trusting
# any pin number here; it genuinely varies between near-identical listings.
# ----------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    id: main_lcd
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 0

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21

light:
  - platform: monochromatic
    id: backlight
    output: backlight_output
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

touchscreen:
  platform: xpt2046
  id: main_touch
  spi_id: touch_spi
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  # Run through the touchscreen calibration process and paste the reported
  # values here before relying on touch accuracy — these are uncalibrated
  # placeholders.
  calibration_x_min: 0
  calibration_x_max: 4095
  calibration_y_min: 0
  calibration_y_max: 4095

# ----------------------------------------------------------------------
# BLE scale component + entities
# ----------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: components

timemore_dot:
  id: dot_scale

globals:
  - id: current_flow_rate
    type: float
    restore_value: false
    initial_value: '0'

sensor:
  - platform: timemore_dot
    timemore_dot_id: dot_scale
    weight:
      name: "${friendly_name} Weight"
      id: weight_grams
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_weight
              text: !lambda 'return str_sprintf("%.1f", x);'
          # Simple flow-rate estimate from consecutive weight samples --
          # replace with a smoothed rolling-window calc if this is noisy.
          - lambda: |-
              static float last_weight = 0;
              static uint32_t last_time = 0;
              uint32_t now = millis();
              float rate = 0;
              if (last_time != 0 && now > last_time) {
                rate = (x - last_weight) / ((now - last_time) / 1000.0f);
              }
              last_weight = x;
              last_time = now;
              id(current_flow_rate) = rate;
          - lvgl.label.update:
              id: lbl_flow
              text: !lambda 'return str_sprintf("%.1f g/s", id(current_flow_rate));'
          # Auto-timer state machine hook — see HANDOFF.md "Auto-timer
          # logic (not scale-dependent)". Not implemented yet: auto-start
          # on rising weight, auto-stop (plateau for pour-over / sharp drop
          # for espresso), and honoring id(tare_pending_until) from
          # scale-display-lvgl.yaml as a suppression window after a tare.
    battery_level:
      name: "${friendly_name} Battery"
      id: scale_battery
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_battery_pct
              text: !lambda 'return str_sprintf("%.0f%%", x);'

  - platform: wifi_signal
    name: "${friendly_name} Wifi Signal"
    id: wifi_signal_pct
    update_interval: 60s

binary_sensor:
  - platform: timemore_dot
    timemore_dot_id: dot_scale
    connected:
      name: "${friendly_name} Scale Connected"
      id: ble_connected
      on_state:
        then:
          - lvgl.label.update:
              id: lbl_bt_icon
              text_color: !lambda 'return x ? lv_color_hex(0x5DCAA5) : lv_color_hex(0x7A7A76);'

button:
  - platform: timemore_dot
    timemore_dot_id: dot_scale
    name: "${friendly_name} Tare"
    id: tare_button

packages:
  lvgl_screen: !include scale-display-lvgl.yaml
