# ============================================================================
# Timemore Dot companion display — top-level ESPHome device config
# ============================================================================
#
# Built for the Home Assistant ESPHome add-on. This is the only file you
# need to place in the add-on's config folder yourself (alongside
# secrets.yaml) — the LVGL screen config and the timemore_dot component are
# pulled straight from this project's public GitHub repo at build time via
# `packages:`/`external_components:` below, so you don't need to copy
# scale-display-lvgl.yaml or the components/ folder by hand. See README.md
# for the full walkthrough.
#
# Needs secrets.yaml alongside it — copy secrets.yaml.example and fill in
# real values (the ESPHome add-on keeps one shared secrets.yaml for all your
# device configs, so you likely already have one; just add these keys to it).
#
# NOT YET BUILT OR TESTED ON REAL HARDWARE. See HANDOFF.md for full status —
# in short: the BLE protocol is confirmed from source, the display/touch
# section below is a best-guess placeholder for a specific commonly-sold
# board (not confirmed to match what you actually bought), and the
# timemore_dot component compiles against an API surface that hasn't been
# verified by an actual build yet.
# ============================================================================

substitutions:
  name: timemore-dot-display
  friendly_name: "Timemore Dot Display"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

logger:

# ----------------------------------------------------------------------
# Network fan-out (confirmed design decision, see HANDOFF.md "Multi-device
# / relay considerations"): BLE peripherals like this scale only accept one
# central connection at a time, so this ESP32 is the sole BLE client and
# everything else that wants weight/battery/connection state gets it over
# wifi instead of trying to share the BLE link itself.
#
# `api:` is the primary path — it's what Home Assistant auto-discovers and
# integrates through, and it's already all the sensor/binary_sensor/button
# entities defined below need to become visible in HA (and to be able to
# trigger a remote tare from HA/automations). MQTT is included commented-out
# below as the alternative for any non-HA consumer that wants the data.
# ----------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # NOTE: ESPHome's `dev` branch supports a bare `encryption:` block here
    # that inherits the api: key above instead of a separate password
    # (avoids one secret and some flash/RAM) -- but that hasn't shipped in
    # a numbered release yet as of 2026.8.2, so back to a plain password
    # for now. Worth switching once it's actually released.
    password: !secret ota_password

# Uncomment for non-Home-Assistant consumers. Requires an MQTT broker
# reachable from this device's wifi network (e.g. Mosquitto).
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_username
#   password: !secret mqtt_password

time:
  - platform: sntp
    id: sntp_time

# ----------------------------------------------------------------------
# Display + touch — PLACEHOLDER pin assignments.
#
# HANDOFF.md open item #1: the exact driver chip / touch controller /
# pinout for the specific board purchased was never confirmed. The pins
# below match the commonly-sold "Cheap Yellow Display" (ESP32-2432S028R,
# ILI9341 + resistive XPT2046) because the listing description recorded in
# HANDOFF.md ("2.8 inch ESP32 LVGL WIFI Bluetooth Touch 240x320") is close
# to verbatim marketing copy for that specific board — but this is a guess
# based on how it's usually sold, NOT a confirmed match to your unit.
# CONFIRM against your board's actual silkscreen/schematic before trusting
# any pin number here; it genuinely varies between near-identical listings.
# ----------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    id: main_lcd
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    # Rotation lives under lvgl: instead (scale-display-lvgl.yaml) when
    # LVGL is in use -- ESPHome rejects it here: "use of 'rotation' in the
    # display config is not compatible with LVGL".
    # Became a required option (no default) in a newer ESPHome release than
    # this was originally written against. `false` is the common default
    # for this panel, but it's a real per-panel property, not a placeholder
    # -- if colors look inverted/negative once you can see the screen
    # (e.g. the dark background renders light), flip this to `true`.
    invert_colors: false

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21

light:
  - platform: monochromatic
    id: backlight
    output: backlight_output
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

touchscreen:
  platform: xpt2046
  id: main_touch
  spi_id: touch_spi
  cs_pin: GPIO33
  # GPIO36 is one of the ESP32's input-only pins (34-39) -- no internal
  # pull resistor hardware exists on those at all, so requesting one (the
  # implicit default for an interrupt pin) logs a harmless but noisy
  # `gpio_pullup_en` error every boot. Disabled explicitly here; relies on
  # the touch panel having its own external pull-up on T_IRQ, which is
  # standard on this class of board -- if touch input doesn't register at
  # all once wired up, this assumption is the first thing to revisit.
  interrupt_pin:
    number: GPIO36
    mode:
      input: true
  update_interval: 50ms
  # Run through the touchscreen calibration process and paste the reported
  # values here before relying on touch accuracy — these are uncalibrated
  # placeholders.
  calibration:
    x_min: 0
    x_max: 4095
    y_min: 0
    y_max: 4095
  # Raw touch coordinates come from the panel's fixed physical wiring,
  # independent of the display's `rotation:` above -- since that's now 90
  # (landscape) instead of 0, touch almost certainly needs an axis swap to
  # line up with what's drawn on screen. This is a guess, genuinely
  # untestable without touching the real screen and watching where the
  # touch point actually registers -- try toggling swap_xy/mirror_x/
  # mirror_y here if touches land in the wrong place once the layout
  # itself is confirmed correct.
  transform:
    swap_xy: true

