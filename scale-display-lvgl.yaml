# ============================================================================
# LVGL screen config — Timemore Dot companion display
# ============================================================================
#
# This file assumes the following already exist elsewhere in your ESPHome
# config (display driver, touchscreen driver, wifi:, time:, and the custom
# `timemore_dot` BLE component from the earlier phase of this project):
#
#   display:        id: main_lcd
#   touchscreen:     id: main_touch
#   time:           id: sntp_time         (platform: sntp)
#   wifi:                                  (for wifi_signal % sensor below)
#   sensor.weight_grams        - published by the timemore_dot component
#   sensor.scale_battery       - published by the timemore_dot component
#   binary_sensor.ble_connected - published by the timemore_dot component
#   button.tare_button         - published by the timemore_dot component
#
# These are all defined in timemore-dot-display.yaml, the top-level device
# config that includes this file as a package — that's also where the
# on_value/on_state triggers wiring them into the labels below actually
# live, since they belong on the sensor/binary_sensor entries themselves.
#
# Fonts are pulled at build time via ESPHome's `gfonts://` source (Inter
# and Google's Material Symbols Outlined icon font) — nothing to bundle in
# this repo, no `fonts/` directory needed. Requires internet access at
# build time (fine for the Home Assistant ESPHome add-on).
#
# One thing still flagged as a PLACEHOLDER:
#
#   1. `lvgl.arc.update` — this is the ESPHome LVGL action name for updating
#      an arc widget's value at the time of writing. LVGL/ESPHome's API
#      shifts between versions (there was a real breaking change between
#      LVGL 8 and 9 affecting arc/meter indicators) — verify this action
#      name against the ESPHome version you're actually building against
#      before relying on it: https://esphome.io/components/lvgl/widgets/
#
# Design decision: the reset hold-progress ring and its 1.5s trigger are
# implemented manually (on_press/on_release + a 30ms interval) rather than
# via LVGL's built-in long-press event. There's an open, unresolved
# community question about configuring long-press timing for touchscreen
# button presses specifically (it's well-documented for rotary
# encoder/keypad input devices, not clearly for touch) — so a
# fully-manual timer avoids depending on unclear behavior for something
# you want at an exact, specific duration.
# ============================================================================

font:
  - file:
      type: gfonts
      family: Inter
      weight: 500
    id: font_time
    size: 18
  - file:
      type: gfonts
      family: Inter
      weight: 500
    id: font_weight
    size: 60
  - file:
      type: gfonts
      family: Inter
      weight: 400
    id: font_small
    size: 11
  - file:
      type: gfonts
      family: Inter
      weight: 500
    id: font_timer
    size: 32
  # Google's Material Symbols Outlined icon font, codepoints looked up from
  # google/material-design-icons' *.codepoints file for the variable-font
  # family (not verified by rendering — double check the glyph shown for
  # each of these actually looks right once you can see the real display).
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 20
    glyphs:
      - "\U0000E63E"   # wifi
      - "\U0000E1A8"   # bluetooth_connected
      - "\U0000E1A9"   # bluetooth_disabled
      - "\U0000E1A5"   # battery_full
      - "\U0000E798"   # water_drop (flow rate)
      - "\U0000E3CF"   # exposure_zero (tare)
      - "\U0000E037"   # play_arrow
      - "\U0000E034"   # pause
      - "\U0000E5D5"   # refresh (reset)
      - "\U0000EFEF"   # coffee (pour-over mode)
      - "\U0000EB44"   # local_cafe (espresso mode)

globals:
  - id: timer_seconds
    type: int
    restore_value: false
    initial_value: '0'
  - id: timer_running
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: reset_hold_ms
    type: int
    restore_value: false
    initial_value: '0'
  - id: brew_mode_espresso
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: tare_pending_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: reset_held
    type: bool
    restore_value: false
    initial_value: 'false'

# ----------------------------------------------------------------------------
# Timer tick + reset-hold ring animation
# ----------------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(timer_running);'
          then:
            - lambda: 'id(timer_seconds) += 1;'
            - lvgl.label.update:
                id: lbl_timer
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%02d:%02d", id(timer_seconds) / 60, id(timer_seconds) % 60);
                  return std::string(buf);

  - interval: 30ms
    then:
      - if:
          condition:
            lambda: 'return id(reset_held) && id(reset_hold_ms) < 1500;'
          then:
            - lambda: 'id(reset_hold_ms) += 30;'
            - lvgl.arc.update:
                id: arc_reset
                value: !lambda 'return id(reset_hold_ms);'
            - if:
                condition:
                  lambda: 'return id(reset_hold_ms) >= 1500;'
                then:
                  - script.execute: do_reset

  - interval: 1s
    then:
      # refresh clock + date labels from the sntp time source
      - lvgl.label.update:
          id: lbl_time
          text: !lambda 'return id(sntp_time).now().strftime("%H:%M");'
      - lvgl.label.update:
          id: lbl_date
          text: !lambda 'return id(sntp_time).now().strftime("%a, %b %d");'

# ----------------------------------------------------------------------------
# Actions
# ----------------------------------------------------------------------------
script:
  - id: do_tare
    then:
      - button.press: tare_button
      # Suppress auto-stop false triggers for 1.5s after a manual tare —
      # a tare causes an instant weight drop that otherwise looks like
      # "cup removed" to the auto-timer logic.
      - lambda: 'id(tare_pending_until) = millis() + 1500;'

  - id: toggle_timer
    then:
      - lambda: 'id(timer_running) = !id(timer_running);'
      - lvgl.label.update:
          id: lbl_playpause_icon
          text: !lambda 'return id(timer_running) ? "\U0000E034" : "\U0000E037";'
      - lvgl.label.update:
          id: lbl_playpause_text
          text: !lambda 'return id(timer_running) ? "Pause" : "Start";'

  - id: do_reset
    then:
      - lambda: |-
          id(timer_running) = false;
          id(timer_seconds) = 0;
          id(reset_hold_ms) = 0;
          id(reset_held) = false;
      - lvgl.label.update:
          id: lbl_timer
          text: "00:00"
      - lvgl.label.update:
          id: lbl_playpause_icon
          text: "\U0000E037"
      - lvgl.label.update:
          id: lbl_playpause_text
          text: "Start"
      - lvgl.arc.update:
          id: arc_reset
          value: 0

  - id: toggle_mode
    then:
      - lambda: 'id(brew_mode_espresso) = !id(brew_mode_espresso);'
      - lvgl.label.update:
          id: lbl_mode
          text: !lambda 'return id(brew_mode_espresso) ? "Espresso mode" : "Pour-over mode";'
      - lvgl.label.update:
          id: lbl_mode_icon
          text: !lambda 'return id(brew_mode_espresso) ? "\U0000EB44" : "\U0000EFEF";'

# ----------------------------------------------------------------------------
# Screen layout — target resolution 240x320 portrait
# ----------------------------------------------------------------------------
lvgl:
  displays:
    - main_lcd
  touchscreens:
    - main_touch
  bg_color: 0x0B0F0E
  pages:
    - id: main_page
      bg_color: 0x0B0F0E
      widgets:

        # ---- status row ----
        - label:
            id: lbl_time
            x: 8
            y: 8
            text_font: font_time
            text_color: 0xF2F2EF
            text: "--:--"
        - label:
            id: lbl_date
            x: 8
            y: 30
            text_font: font_small
            text_color: 0x7A7A76
            text: "----"
        - label:
            id: lbl_wifi_icon
            x: 148
            y: 10
            text_font: font_icons
            text_color: 0x5DCAA5
            text: "\U0000E63E"
        - label:
            # Starts on the "disconnected" glyph/dim color -- the BLE link
            # isn't up yet at boot. Swapped to bluetooth_connected/bright
            # by ble_connected's on_state trigger in timemore-dot-display.yaml.
            id: lbl_bt_icon
            x: 176
            y: 10
            text_font: font_icons
            text_color: 0x7A7A76
            text: "\U0000E1A9"
        - label:
            id: lbl_battery_pct
            x: 198
            y: 12
            text_font: font_small
            text_color: 0xC9C9C4
            text: "--%"
        - label:
            id: lbl_battery_icon
            x: 222
            y: 10
            text_font: font_icons
            text_color: 0xC9C9C4
            text: "\U0000E1A5"

        # ---- weight ----
        - label:
            id: lbl_weight
            align: TOP_MID
            y: 88
            text_font: font_weight
            text_color: 0xF2F2EF
            text: "0.0"
        - label:
            id: lbl_flow_icon
            align: TOP_MID
            y: 160
            x: -28
            text_font: font_icons
            text_color: 0x7A7A76
            text: "\U0000E798"
        - label:
            id: lbl_flow
            align: TOP_MID
            y: 160
            x: 4
            text_font: font_small
            text_color: 0x7A7A76
            text: "0.0 g/s"

        # ---- timer ----
        - label:
            id: lbl_timer
            align: TOP_MID
            y: 192
            text_font: font_timer
            text_color: 0xF2F2EF
            text: "00:00"
        # "auto" badge — hidden by default; show/hide this from the
        # auto-timer detection logic once it's implemented (see HANDOFF.md,
        # "Auto-timer logic"). Position is a first guess, not yet verified
        # against real rendering.
        - label:
            id: lbl_auto_badge
            align: TOP_MID
            x: 54
            y: 198
            text_font: font_small
            text_color: 0x5DCAA5
            text: "AUTO"
            hidden: true
        - label:
            id: lbl_mode
            align: TOP_MID
            y: 230
            text_font: font_small
            text_color: 0x7A7A76
            text: "Pour-over mode"

        # ---- button row (y baseline ~254, screen bottom margin 20px) ----
        - button:
            id: btn_tare
            x: 8
            y: 254
            width: 46
            height: 46
            radius: 23
            bg_color: 0x1C211F
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: 0xF2F2EF
                  text: "\U0000E3CF"
            on_click:
              - script.execute: do_tare

        - button:
            id: btn_playpause
            x: 64
            y: 246
            width: 54
            height: 54
            radius: 27
            bg_color: 0x1D9E75
            widgets:
              - label:
                  id: lbl_playpause_icon
                  align: CENTER
                  text_font: font_icons
                  text_color: 0x04342C
                  text: "\U0000E037"
            on_click:
              - script.execute: toggle_timer

        # reset control: arc (progress ring) + button drawn as overlapping
        # siblings — the button is declared after the arc so it renders on
        # top, avoiding any assumption about whether `arc` supports nested
        # child widgets.
        - arc:
            id: arc_reset
            x: 124
            y: 250
            width: 54
            height: 54
            min_value: 0
            max_value: 1500
            value: 0
            arc_width: 6
            arc_color: 0x2A302D
            adjustable: false
            indicator:
              arc_width: 6
              arc_color: 0xF09595
        - button:
            id: btn_reset
            x: 130
            y: 256
            width: 42
            height: 42
            radius: 21
            bg_color: 0x1C211F
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: 0xF2F2EF
                  text: "\U0000E5D5"
            on_press:
              - lambda: |-
                  id(reset_held) = true;
                  id(reset_hold_ms) = 0;
            on_release:
              - lambda: |-
                  id(reset_held) = false;
                  id(reset_hold_ms) = 0;
              - lvgl.arc.update:
                  id: arc_reset
                  value: 0

        - button:
            id: btn_mode
            x: 186
            y: 254
            width: 46
            height: 46
            radius: 23
            bg_color: 0x1C211F
            widgets:
              - label:
                  id: lbl_mode_icon
                  align: CENTER
                  text_font: font_icons
                  text_color: 0xF2F2EF
                  text: "\U0000EFEF"
            on_click:
              - script.execute: toggle_mode

# ----------------------------------------------------------------------------
# Live sensor wiring now lives in timemore-dot-display.yaml (the top-level
# device config that includes this file as a package), on the
# sensor/binary_sensor/button entries themselves — weight_grams,
# scale_battery, wifi_signal_pct, ble_connected, tare_button. See that file's
# `on_value`/`on_state` triggers and the do_tare script above for how they
# reach the labels/buttons defined in this file.
#
# Still not wired to anything: lbl_wifi_icon never updates (only one wifi
# glyph exists in the icon font — see the icon-font open item in
# HANDOFF.md, tiered strong/medium/weak icons would need more glyphs first)
# and the auto-timer start/stop detection that would show/hide
# lbl_auto_badge — both flagged as open items in HANDOFF.md.
# ----------------------------------------------------------------------------
